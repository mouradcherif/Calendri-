
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier Sep–Déc 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: #e2e0d8;
    --border-mid: #cccabf;
    --text: #1a1a18;
    --text-mid: #5a5955;
    --text-muted: #9a9891;
    --radius: 10px;
    --radius-sm: 6px;

    --travail-bg: #e8f4e8;
    --travail-text: #2d6e2d;
    --travail-border: #b8d8b8;

    --off-bg: #fef0e6;
    --off-text: #c05a10;
    --off-border: #f4c89a;

    --conge-bg: #eef4fe;
    --conge-text: #2356b8;
    --conge-border: #b8ccf4;

    --repos-bg: #f0efec;
    --repos-text: #7a7870;
    --repos-border: #d8d6ce;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  .container { max-width: 900px; margin: 0 auto; }

  header { margin-bottom: 2rem; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -.3px; }
  header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

  .month-nav { display: flex; gap: 6px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .month-btn {
    padding: 7px 18px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; font-weight: 500; color: var(--text-mid);
    cursor: pointer; transition: all .15s;
  }
  .month-btn:hover { border-color: #aaa; color: var(--text); }
  .month-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.5rem; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px;
  }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
  .stat-val { font-size: 22px; font-weight: 600; }
  .stat-val.travail { color: var(--travail-text); }
  .stat-val.conge { color: var(--conge-text); }
  .stat-val.off { color: var(--off-text); }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }

  .day-header {
    text-align: center; font-size: 11px; font-weight: 600;
    color: var(--text-muted); padding: 0 0 8px;
    text-transform: uppercase; letter-spacing: .06em;
  }

  .day-cell {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); min-height: 82px; padding: 7px 8px;
    cursor: pointer; transition: border-color .12s, box-shadow .12s;
    position: relative;
  }
  .day-cell:hover:not(.empty):not(.other-month) { border-color: #aaa; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .day-cell.empty, .day-cell.other-month { background: transparent; border-color: transparent; cursor: default; min-height: 82px; }
  .day-cell.other-month .day-num { color: #ccc; }

  .day-cell.type-repos { background: var(--repos-bg); border-color: var(--repos-border); cursor: default; }
  .day-cell.type-travail { background: var(--travail-bg); border-color: var(--travail-border); }
  .day-cell.type-off { background: var(--off-bg); border-color: var(--off-border); }
  .day-cell.type-conge { background: var(--conge-bg); border-color: var(--conge-border); }

  .day-num { font-size: 12px; font-weight: 600; color: var(--text-mid); margin-bottom: 5px; }
  .day-cell.type-repos .day-num { color: var(--repos-text); }
  .day-cell.type-travail .day-num { color: var(--travail-text); }
  .day-cell.type-off .day-num { color: var(--off-text); }
  .day-cell.type-conge .day-num { color: var(--conge-text); }

  .day-tag {
    display: inline-block; font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 4px; margin-bottom: 3px;
  }
  .tag-travail { background: rgba(45,110,45,.15); color: var(--travail-text); }
  .tag-off { background: rgba(192,90,16,.15); color: var(--off-text); }
  .tag-conge { background: rgba(35,86,184,.15); color: var(--conge-text); }
  .tag-repos { background: rgba(122,120,112,.12); color: var(--repos-text); }

  .day-shift { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .day-cell.type-travail .day-shift { color: var(--travail-text); opacity: .75; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.35); z-index: 100;
    align-items: center; justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius);
    width: 100%; max-width: 340px;
    border: 1px solid var(--border);
    box-shadow: 0 16px 48px rgba(0,0,0,.18);
    overflow: hidden;
  }
  .modal-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-size: 15px; font-weight: 600; }
  .modal-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .modal-close {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: transparent;
    cursor: pointer; font-size: 16px; color: var(--text-mid);
    display: flex; align-items: center; justify-content: center;
    transition: background .12s;
  }
  .modal-close:hover { background: var(--bg); }

  .modal-body { padding: 16px 20px 20px; }

  .option-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }

  .option-list { display: flex; flex-direction: column; gap: 6px; }
  .option-btn {
    width: 100%; padding: 11px 14px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); background: var(--bg);
    text-align: left; cursor: pointer; transition: all .12s;
    display: flex; align-items: center; justify-content: space-between;
  }
  .option-btn:hover { border-color: #999; background: var(--surface); }
  .option-btn.selected { border-color: currentColor; }
  .option-btn .opt-name { font-size: 13px; font-weight: 600; }
  .option-btn .opt-time { font-size: 11px; opacity: .7; margin-top: 1px; }
  .option-btn .opt-check { font-size: 14px; display: none; }
  .option-btn.selected .opt-check { display: block; }

  .option-btn.opt-travail { color: var(--travail-text); }
  .option-btn.opt-travail.selected { background: var(--travail-bg); border-color: var(--travail-text); }
  .option-btn.opt-off { color: var(--off-text); }
  .option-btn.opt-off.selected { background: var(--off-bg); border-color: var(--off-text); }
  .option-btn.opt-conge { color: var(--conge-text); }
  .option-btn.opt-conge.selected { background: var(--conge-bg); border-color: var(--conge-text); }

  .modal-footer {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .btn {
    padding: 8px 18px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all .12s;
  }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-mid); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-primary { background: var(--text); color: #fff; border: 1px solid var(--text); }
  .btn-primary:hover { opacity: .85; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

  .save-toast {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    background: #1a1a18; color: #fff; font-size: 13px;
    padding: 10px 18px; border-radius: 20px;
    opacity: 0; transform: translateY(8px);
    transition: all .2s; pointer-events: none; z-index: 200;
  }
  .save-toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .cal-grid { gap: 3px; }
    .day-cell { min-height: 64px; padding: 5px 6px; }
    .day-shift { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Calendrier de travail 2026</h1>
    <p>Sep → Déc</p>
  </header>

  <nav class="month-nav" id="monthNav"></nav>
  <div class="stats" id="stats"></div>
  <div class="cal-grid" id="calGrid"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#b8d8b8;border:1px solid #88b888;"></div>Travail</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f4c89a;border:1px solid #d8a870;"></div>Journée OFF</div>
    <div class="legend-item"><div class="legend-dot" style="background:#b8ccf4;border:1px solid #8899e0;"></div>Congé payé</div>
    <div class="legend-item"><div class="legend-dot" style="background:#d8d6ce;border:1px solid #b8b6ae;"></div>Repos hebdo</div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">Modifier le jour</div>
        <div class="modal-date" id="modalDate"></div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Fermer">✕</button>
    </div>
    <div class="modal-body">
      <div class="option-label">Type de journée</div>
      <div class="option-list" id="optionList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancelBtn">Annuler</button>
      <button class="btn btn-primary" id="saveBtn">Enregistrer</button>
    </div>
  </div>
</div>

<div class="save-toast" id="toast">✓ Modifications enregistrées</div>

<script>
const STORAGE_KEY = 'calendrier_mac_2026';

const MONTHS = [
  { name: 'Septembre', month: 8,  year: 2026, days: 30, startDow: 1 },
  { name: 'Octobre',   month: 9,  year: 2026, days: 31, startDow: 3 },
  { name: 'Novembre',  month: 10, year: 2026, days: 30, startDow: 6 },
  { name: 'Décembre',  month: 11, year: 2026, days: 31, startDow: 1 }
];

const OPTIONS = [
  { key: 'TRAVAIL_11', type: 'TRAVAIL', label: 'Travail — Matin/Midi', time: '11:00 - 20:00', cls: 'opt-travail' },
  { key: 'TRAVAIL_14', type: 'TRAVAIL', label: 'Travail — Après-midi/Soir', time: '14:30 - 23:30', cls: 'opt-travail' },
  { key: 'OFF',        type: 'OFF',    label: 'Journée OFF', time: '', cls: 'opt-off' },
  { key: 'CONGE',      type: 'CONGE',  label: 'Congé payé', time: '', cls: 'opt-conge' }
];

const DOW_LABELS = ['Lun.', 'Mar.', 'Mer.', 'Jeu.', 'Ven.', 'Sam.', 'Dim.'];
const MONTH_NAMES_FULL = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

function dateKey(d, m, y) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  showToast();
}

let data = loadData();
let activeMonthIdx = 0;
let modalKey = null;
let pendingKey = null;

function getDay(key, isWeekend) {
  if (data[key]) return data[key];
  if (isWeekend) return { key: 'REPOS', type: 'REPOS', label: 'Repos', time: '' };
  return { key: 'TRAVAIL_11', type: 'TRAVAIL', label: 'Travail', time: '11:00 - 20:00' };
}

function optionByKey(k) {
  return OPTIONS.find(o => o.key === k) || null;
}

function renderTabs() {
  const nav = document.getElementById('monthNav');
  nav.innerHTML = '';
  MONTHS.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (i === activeMonthIdx ? ' active' : '');
    btn.textContent = m.name;
    btn.onclick = () => { activeMonthIdx = i; render(); };
    nav.appendChild(btn);
  });
}

function renderStats(mIdx) {
  const { month, year, days, startDow } = MONTHS[mIdx];
  let travail = 0, conge = 0, off = 0;
  for (let d = 1; d <= days; d++) {
    const dow = (startDow + d - 1) % 7;
    const isWeekend = dow >= 5;
    const key = dateKey(d, month, year);
    const info = getDay(key, isWeekend);
    if (info.type === 'TRAVAIL') travail++;
    else if (info.type === 'CONGE') conge++;
    else if (info.type === 'OFF') off++;
  }
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat"><div class="stat-label">Jours travaillés</div><div class="stat-val travail">${travail}</div></div>
    <div class="stat"><div class="stat-label">Congés</div><div class="stat-val conge">${conge}</div></div>
    <div class="stat"><div class="stat-label">Jours OFF</div><div class="stat-val off">${off}</div></div>
    <div class="stat"><div class="stat-label">Total jours ouvrés</div><div class="stat-val">${travail + conge + off}</div></div>
  `;
}

function renderCalendar(mIdx) {
  const { month, year, days, startDow } = MONTHS[mIdx];
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  DOW_LABELS.forEach(d => {
    const h = document.createElement('div');
    h.className = 'day-header';
    h.textContent = d;
    grid.appendChild(h);
  });

  for (let i = 0; i < startDow; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell empty';
    grid.appendChild(cell);
  }

  for (let d = 1; d <= days; d++) {
    const dow = (startDow + d - 1) % 7;
    const isWeekend = dow >= 5;
    const key = dateKey(d, month, year);
    const info = getDay(key, isWeekend);

    const cell = document.createElement('div');
    const typeClass = info.type ? 'type-' + info.type.toLowerCase() : '';
    cell.className = `day-cell ${typeClass}`;
    cell.dataset.key = key;
    cell.dataset.isWeekend = isWeekend ? '1' : '0';

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = d;
    cell.appendChild(numEl);

    const tagMap = { TRAVAIL: 'travail', OFF: 'off', CONGE: 'conge', REPOS: 'repos' };
    const tagCls = tagMap[info.type] || 'repos';
    const tagLabel = info.type === 'TRAVAIL' ? 'Travail' : info.type === 'OFF' ? 'OFF' : info.type === 'CONGE' ? 'Congé' : 'Repos';

    const tag = document.createElement('div');
    tag.className = `day-tag tag-${tagCls}`;
    tag.textContent = tagLabel;
    cell.appendChild(tag);

    if (info.time) {
      const t = document.createElement('div');
      t.className = 'day-shift';
      t.textContent = info.time;
      cell.appendChild(t);
    }

    if (!isWeekend) {
      cell.addEventListener('click', () => openModal(key, d, month, year));
    }

    grid.appendChild(cell);
  }

  const trailing = (7 - (startDow + days) % 7) % 7;
  for (let i = 0; i < trailing; i++) {
    const cell = document.createElement('div');
    cell.className = 'day-cell other-month';
    cell.innerHTML = `<div class="day-num">${i+1}</div>`;
    grid.appendChild(cell);
  }
}

function render() {
  renderTabs();
  renderStats(activeMonthIdx);
  renderCalendar(activeMonthIdx);
}

function openModal(key, d, month, year) {
  modalKey = key;
  pendingKey = null;

  const currentInfo = data[key];
  const currentOptKey = currentInfo ? currentInfo.key : 'TRAVAIL_11';

  document.getElementById('modalDate').textContent =
    `${d} ${MONTH_NAMES_FULL[month]} ${year}`;

  const list = document.getElementById('optionList');
  list.innerHTML = '';
  OPTIONS.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = `option-btn ${opt.cls}${opt.key === currentOptKey ? ' selected' : ''}`;
    btn.dataset.optKey = opt.key;
    btn.innerHTML = `
      <div>
        <div class="opt-name">${opt.label}</div>
        ${opt.time ? `<div class="opt-time">${opt.time}</div>` : ''}
      </div>
      <span class="opt-check">✓</span>
    `;
    btn.addEventListener('click', () => {
      list.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      pendingKey = opt.key;
    });
    list.appendChild(btn);
  });

  pendingKey = currentOptKey;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  modalKey = null;
  pendingKey = null;
}

function saveModal() {
  if (!modalKey || !pendingKey) { closeModal(); return; }
  const opt = optionByKey(pendingKey);
  if (!opt) { closeModal(); return; }
  data[modalKey] = { key: opt.key, type: opt.type, label: opt.label, time: opt.time };
  saveData(data);
  closeModal();
  renderStats(activeMonthIdx);
  renderCalendar(activeMonthIdx);
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('saveBtn').addEventListener('click', saveModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

render();
</script>
</body>
</html>
